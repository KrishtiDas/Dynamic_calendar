<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock & Calendar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <h1>Digital Clock & Calendar</h1>
            <p>Stay updated with the current time and date</p>
        </header>


        <!-- Clock Section -->
        <section class="clock-section">

            <div class="clock-card">

                <div class="day" id="day">
                    Thursday
                </div>

                <div class="date" id="date">
                    13 August 2026
                </div>

                <div class="time" id="time">
                    11:42:36 PM
                </div>

            </div>

        </section>


        <!-- Calendar Section -->
        <section class="calendar-section">

            <div class="calendar-card">

                <!-- Calendar Header -->
                <div class="calendar-header">

                    <button id="prev-month" class="nav-btn">
                        &#10094;
                    </button>

                    <h2 id="month-year">
                        August 2026
                    </h2>

                    <button id="next-month" class="nav-btn">
                        &#10095;
                    </button>

                </div>


                <!-- Today Button -->
                <button id="today-btn" class="today-btn">
                    Today
                </button>


                <!-- Weekdays -->
                <div class="weekdays">

                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>

                </div>


                <!-- Calendar Dates -->
                <div class="calendar-days" id="calendar-days">

                    <!-- JavaScript will generate dates here -->

                </div>

            </div>

        </section>


        <!-- Selected Date -->
        <section class="selected-date-section">

            <p id="selected-date">
                Select a date from the calendar
            </p>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
